worker_processes 1;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 80;
    server_name _;

    root /home/ec2-user/frontend;

    location = /lista-ingredientes {
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods "GET, OPTIONS";
      add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";

      # Verificar qual é o IP do backend na conta do Presilli e substituir 
      proxy_pass http://10.0.0.5:3000/lista-ingredientes;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    location = /lista-ingredientes {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
        return 204;
      }
    }

    # 2) Alternative: serve a static JSON file shipped with the frontend build
    # Uncomment and use this block instead of proxy_pass if you prefer static
    # location = /lista-ingredientes {
    #   add_header Content-Type application/json;
    #   add_header Access-Control-Allow-Origin *;
    #   alias /home/your_user/frontend/lista-ingredientes.json;
    # }

    # Serve frontend (static files)
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
