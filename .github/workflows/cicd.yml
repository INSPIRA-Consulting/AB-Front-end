name: CI/CD para EC2 pública e privada

on:
  push:
    branches:
      - master # O branch que acionará o deploy
  
  workflow_dispatch: # Permite execução manual do workflow
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2. Configuração do ambiente Node
      - name: FE - Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # 3. Build da aplicação (Se for uma aplicação que precisa ser construída, ex: React, Angular, Vue)
      - name: FE - Instalar Dependências e Fazer Build
        run: |
             # Criar arquivo .env com o IP privado ANTES do build
             echo "VITE_IP_API=${{ secrets.REMOTE_HOST_PRIVADO }}" > .env

             echo "📋 Conteúdo do arquivo .env:"
             cat .env

             npm install
             npm install axios
             
             echo "🏗️ Iniciando build..."
             npm run build
             
             echo "✅ Build concluído!"
        working-directory: ./anjos-bolos-front-end

      # 4. Deploy (Transferência de arquivos e execução de comandos remotos)
      - name: FE - Copiar arquivos e Deploy (Usando SSH com rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /home/${{ secrets.REMOTE_USER }}/frontend
          # ARGS para rsync: removido -o para não preservar owner
          ARGS: "-rltgDzvpO --delete" 
          # SOURCE: O que será copiado. Pode ser o diretório de build (ex: ./dist)
          SOURCE: "./anjos-bolos-front-end/dist/"
      # 5. Configurar Nginx e Reiniciar
      - name: FE - Executar Comando Shell na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }} 
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}  
          script: |
            set -e
            
            # Criar diretório de configuração se não existir
            mkdir -p /home/${{ secrets.REMOTE_USER }}/nginx-config
            
            # Criar arquivo de configuração do Nginx com IP correto
            cat > /home/${{ secrets.REMOTE_USER }}/nginx-config/default.conf << 'EOF'
            server {
                listen 80;
                server_name _;

                location / {
                    root /usr/share/nginx/html;
                    try_files $uri $uri/ /index.html;
                }

                location /api/ {
                    proxy_pass http://${{ secrets.REMOTE_HOST_PRIVADO }}:8080/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF
            
            echo "Arquivo default.conf do Nginx criado/atualizado"
            cat /home/${{ secrets.REMOTE_USER }}/nginx-config/default.conf
            
            # Corrigir permissões
            sudo chmod -R 755 /home/${{ secrets.REMOTE_USER }}/frontend
            sudo find /home/${{ secrets.REMOTE_USER }}/frontend -type f -exec chmod 644 {} \;
            
            # Parar e remover container antigo
            docker stop frontend_nginx 2>/dev/null || true
            docker rm frontend_nginx 2>/dev/null || true
            
            # Subir Nginx com nova configuração
            cd /home/${{ secrets.REMOTE_USER }}
            docker compose -f compose.yaml up -d
            
            echo "Aguardando Nginx iniciar..."
            sleep 3
            
            # Verificar se está rodando
            docker ps | grep frontend_nginx
            
            echo "Nginx configurado e reiniciado com sucesso!"