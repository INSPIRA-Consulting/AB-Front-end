name: CI/CD para EC2 pública e privada

on:
  push:
    branches:
      - master # O branch que acionará o deploy
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2. Deploy (Transferência de código fonte)
      - name: FE - Copiar código fonte para EC2
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /home/${{ secrets.REMOTE_USER }}/frontend-build
          ARGS: "-rltgDzvp --delete"
          SOURCE: "./anjos-bolos-front-end/"
          EXCLUDE: "/node_modules/, /dist/, /.git/"
      # 3. Build no servidor e configurar ambiente
      - name: FE - Executar Comando Shell na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }} 
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Verificar e instalar Node.js se não estiver instalado
            if ! command -v node &> /dev/null; then
              echo "Node.js não encontrado. Instalando..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
              echo "Node.js instalado com sucesso"
            else
              echo "Node.js já está instalado: $(node -v)"
            fi

            # Verificar npm
            if ! command -v npm &> /dev/null; then
              echo "npm não encontrado. Instalando..."
              sudo apt-get install -y npm
            else
              echo "npm já está instalado: $(npm -v)"
            fi

            # Criar arquivo .env com o IP privado ANTES do build
            cd /home/${{ secrets.REMOTE_USER }}/frontend-build
            echo "IP_API=${{ secrets.REMOTE_HOST_PRIVADO }}" > .env
            echo "Arquivo .env criado com IP_API=${{ secrets.REMOTE_HOST_PRIVADO }}"

            # Instalar dependências e buildar com o .env correto
            echo "Instalando dependências..."
            npm install
            echo "Executando build..."
            npm run build
            echo "Build concluído com variáveis de ambiente corretas"

            # Copiar build para pasta do Nginx
            sudo rm -rf /home/${{ secrets.REMOTE_USER }}/frontend/*
            sudo cp -r dist/* /home/${{ secrets.REMOTE_USER }}/frontend/
            echo "Arquivos copiados para /frontend"

            # Corrigir permissões
            sudo chmod -R 755 /home/${{ secrets.REMOTE_USER }}/frontend
            sudo find /home/${{ secrets.REMOTE_USER }}/frontend -type f -exec chmod 644 {} \;
            echo "Permissões corrigidas"

            # Reiniciar API (se o docker-compose estiver na raiz)
            if [ -f /home/${{ secrets.REMOTE_USER }}/docker-compose.yml ]; then
              cd /home/${{ secrets.REMOTE_USER }}
              sudo docker compose restart api
              echo "API reiniciada"
            fi

            # Reiniciar Nginx
            if [ -f /home/${{ secrets.REMOTE_USER }}/frontend/docker-compose.yml ]; then
              cd /home/${{ secrets.REMOTE_USER }}/frontend
              sudo docker compose restart web_server
              echo "Nginx reiniciado"
            fi

            echo "Deploy concluído com sucesso!"