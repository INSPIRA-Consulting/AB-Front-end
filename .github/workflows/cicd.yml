name: CI/CD para EC2 pública e privada

on:
  push:
    branches:
      - master # O branch que acionará o deploy
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2. Configuração do ambiente Node
      - name: FE - Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # 3. Build da aplicação (Se for uma aplicação que precisa ser construída, ex: React, Angular, Vue)
      - name: FE - Instalar Dependências e Fazer Build
        run: |
             # Criar arquivo .env com o IP privado ANTES de instalar dependências
             echo "VITE_IP_API=${{ secrets.REMOTE_HOST_PRIVADO }}" > .env

             echo "📋 Conteúdo do arquivo .env:"
             cat .env
             
             echo "🔍 Verificando variável de ambiente:"
             echo "VITE_IP_API=${{ secrets.REMOTE_HOST_PRIVADO }}"

             npm install
             npm install axios
             
             echo "🏗️ Iniciando build..."
             npm run build
             
             echo "✅ Build concluído!"
             echo "📁 Verificando arquivos buildados:"
             ls -la dist/
             
             echo "🔍 Verificando se o IP foi injetado no build:"
             grep -r "REMOTE_HOST_PRIVADO\|${{ secrets.REMOTE_HOST_PRIVADO }}" dist/ || echo "IP não encontrado literalmente (isso é normal, está embedado no JS)"
        working-directory: ./anjos-bolos-front-end

      # 4. Deploy (Transferência de arquivos e execução de comandos remotos)
      - name: FE - Copiar arquivos e Deploy (Usando SSH com rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /home/${{ secrets.REMOTE_USER }}/frontend
          # ARGS para rsync: removido -o para não preservar owner
          ARGS: "-rltgDzvpO --delete" 
          # SOURCE: O que será copiado. Pode ser o diretório de build (ex: ./dist)
          SOURCE: "./anjos-bolos-front-end/dist/"
      # 5. Atualizando o IP privado da API e reiniciando o docker do Nginx
      - name: FE - Executar Comando Shell na EC2
        uses: appleboy/ssh-action@v1.0.3 # Action popular para SSH
        with:
          host: ${{ secrets.REMOTE_HOST }} 
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}  

          # O Comando ou Script a ser Executado no EC2
          # Use o pipe '|' para comandos de múltiplas linhas
          script: |
            set -e

            export IP_PORTA_API=${{ secrets.REMOTE_HOST_PRIVADO }}:8080
            echo "Variável de IP e porta da API criada: $IP_PORTA_API"
            
            envsubst '${IP_PORTA_API}' < /home/${{ secrets.REMOTE_USER }}/frontend/nginx/templates/default.conf.template > /home/${{ secrets.REMOTE_USER }}/frontend/nginx/conf.d/default.conf
            echo "Arquivo default.conf do nginx criado"

            docker compose -f /home/${{ secrets.REMOTE_USER }}/compose.yaml down
            echo "Docker compose do Nginx parado"
            
            docker compose -f /home/${{ secrets.REMOTE_USER }}/compose.yaml up -d --build
            echo "Docker compose do Nginx reiniciado"