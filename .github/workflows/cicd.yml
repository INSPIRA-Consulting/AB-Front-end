name: CI/CD para EC2 pública e privada

on:
  push:
    branches:
      - master # O branch que acionará o deploy

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
#Teste
    steps:
      # 1. Checkout do código
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2. Configuração do ambiente Node
      - name: FE - Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # 3. Build da aplicação
      - name: FE - Instalar Dependências e Fazer Build
        run: |
             npm install
             npm install axios
             npm run build --if-present 
        working-directory: ./anjos-bolos-front-end

      # 4. Deploy dos arquivos do build (React)
      - name: FE - Copiar arquivos do build
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /home/${{ secrets.REMOTE_USER }}/frontend
          ARGS: "-rltgoDzvO --delete" 
          SOURCE: "./anjos-bolos-front-end/dist/"

      # 5. Verificar e listar arquivos antes de copiar
      - name: FE - Verificar arquivos de configuração
        run: |
          echo "Listando arquivos na raiz do projeto:"
          ls -la ./
          echo "Verificando se nginx.conf existe:"
          if [ -f "./nginx.conf" ]; then echo "✅ nginx.conf encontrado"; else echo "❌ nginx.conf NÃO encontrado"; fi
          echo "Verificando se compose.yaml existe:"
          if [ -f "./compose.yaml" ]; then echo "✅ compose.yaml encontrado"; else echo "❌ compose.yaml NÃO encontrado"; fi

      # 6. Copiar nginx.conf individualmente
      - name: FE - Copiar nginx.conf
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /home/${{ secrets.REMOTE_USER }}/
          ARGS: "-rltgoDzvO"
          SOURCE: "./nginx.conf"

      # 7. Copiar compose.yaml individualmente
      - name: FE - Copiar compose.yaml
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /home/${{ secrets.REMOTE_USER }}/
          ARGS: "-rltgoDzvO"
          SOURCE: "./compose.yaml"

      # 8. Reiniciar serviços
      - name: FE - Reiniciar serviços Docker
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.REMOTE_USER }}/
            echo "Verificando arquivos copiados:"
            ls -la nginx.conf compose.yaml
            echo "Parando containers..."
            sudo docker compose down
            echo "Iniciando containers com nova configuração..."
            sudo docker compose up -d
            echo "Verificando status dos containers..."
            sudo docker compose ps
            echo "Frontend e API reiniciados com sucesso!"